<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NoelSMP – Admin Panel</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top, #142d55 0%, #071426 45%, #030914 100%);
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 50px 0;
        }

        h1 {
            text-align: center;
            font-family: "Press Start 2P", monospace;
            color: #6db7ff;
            font-size: 28px;
            margin-bottom: 40px;
        }

        .panel {
            background: rgba(10, 25, 50, 0.85);
            border: 1px solid rgba(80, 150, 255, 0.3);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
        }

        h2 {
            font-family: "Press Start 2P", monospace;
            font-size: 16px;
            color: #8ec7ff;
            margin-top: 0;
        }

        input {
            width: 100%;
            background: #071426;
            border: 1px solid #315b91;
            border-radius: 8px;
            padding: 14px;
            color: white;
            font-size: 15px;
            outline: none;
            margin-bottom: 15px;
        }

        input:focus {
            border-color: #6db7ff;
        }

        .editor-wrapper {
            margin-bottom: 15px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 10px;
            background: #0b1c34;
            border: 1px solid #315b91;
            border-bottom: none;
            border-radius: 8px 8px 0 0;
        }

        .toolbar button {
            min-width: 40px;
            height: 38px;
            padding: 7px 11px;
            border: 1px solid #315b91;
            border-radius: 6px;
            background: #102a4d;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .toolbar button:hover {
            background: #1769d1;
            border-color: #6db7ff;
        }

        .toolbar .bold {
            font-weight: 900;
        }

        .toolbar .italic {
            font-style: italic;
        }

        .toolbar .underline {
            text-decoration: underline;
        }

        .toolbar .strike {
            text-decoration: line-through;
        }

        .toolbar-separator {
            width: 1px;
            background: #315b91;
            margin: 2px 4px;
        }

        .color-label {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 0 6px;
            color: #b9d9ff;
            font-size: 13px;
        }

        .color-picker {
            width: 38px !important;
            height: 32px;
            padding: 2px !important;
            margin: 0 !important;
            border: 1px solid #315b91;
            border-radius: 5px;
            background: #071426;
            cursor: pointer;
        }

        #newsMessage {
            width: 100%;
            min-height: 160px;
            padding: 14px;
            background: #071426;
            border: 1px solid #315b91;
            border-radius: 0 0 8px 8px;
            color: white;
            font-size: 15px;
            line-height: 1.6;
            outline: none;
            overflow-y: auto;
        }

        #newsMessage:focus {
            border-color: #6db7ff;
        }

        #newsMessage:empty::before {
            content: attr(data-placeholder);
            color: #6d7f96;
            pointer-events: none;
        }

        .main-button {
            border: none;
            border-radius: 8px;
            padding: 13px 20px;
            background: #1769d1;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .main-button:hover {
            background: #2582f2;
            transform: translateY(-1px);
        }

        .logout {
            background: #a83232;
            float: right;
        }

        .logout:hover {
            background: #d33d3d;
        }

        .hidden {
            display: none;
        }

        .error {
            color: #ff6b6b;
            margin-top: 10px;
        }

        .success {
            color: #6dff9a;
            margin-top: 10px;
        }

        .news-item {
            background: rgba(5, 15, 30, 0.8);
            border: 1px solid rgba(80, 150, 255, 0.2);
            border-radius: 10px;
            padding: 18px;
            margin-top: 15px;
        }

        .news-date {
            color: #6db7ff;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .news-message {
            line-height: 1.6;
            margin-bottom: 15px;
            overflow-wrap: anywhere;
        }

        .news-message strong {
            font-weight: bold;
        }

        .news-message em {
            font-style: italic;
        }

        .news-message u {
            text-decoration: underline;
        }

        .news-message s {
            text-decoration: line-through;
        }

        .delete-button {
            background: #a83232;
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .delete-button:hover {
            background: #d33d3d;
        }

        .back {
            display: inline-block;
            margin-bottom: 25px;
            color: #8ec7ff;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="container">

    <a href="../index.html" class="back">← Zurück zu NoelSMP</a>

    <h1>NOELSMP ADMIN</h1>

    <!-- LOGIN -->
    <div id="loginPanel" class="panel">

        <h2>ADMIN LOGIN</h2>

        <input
            type="email"
            id="email"
            placeholder="E-Mail"
        >

        <input
            type="password"
            id="password"
            placeholder="Passwort"
        >

        <button class="main-button" onclick="login()">
            EINLOGGEN
        </button>

        <div id="loginError" class="error"></div>

    </div>


    <!-- ADMIN BEREICH -->
    <div id="adminPanel" class="hidden">

        <div class="panel">

            <button class="main-button logout" onclick="logout()">
                LOGOUT
            </button>

            <h2>NEUE NEWS</h2>

            <input
                type="date"
                id="newsDate"
            >

            <!-- RICH TEXT EDITOR -->
            <div class="editor-wrapper">

                <div class="toolbar">

                    <button
                        type="button"
                        class="bold"
                        onclick="formatText('bold')"
                        title="Fett"
                    >
                        B
                    </button>

                    <button
                        type="button"
                        class="italic"
                        onclick="formatText('italic')"
                        title="Kursiv"
                    >
                        I
                    </button>

                    <button
                        type="button"
                        class="underline"
                        onclick="formatText('underline')"
                        title="Unterstrichen"
                    >
                        U
                    </button>

                    <button
                        type="button"
                        class="strike"
                        onclick="formatText('strikeThrough')"
                        title="Durchgestrichen"
                    >
                        S
                    </button>

                    <div class="toolbar-separator"></div>

                    <label class="color-label">
                        Farbe:
                        <input
                            type="color"
                            id="textColor"
                            class="color-picker"
                            value="#ffffff"
                            onchange="changeTextColor(this.value)"
                            title="Textfarbe"
                        >
                    </label>

                    <button
                        type="button"
                        onclick="changeTextColor('#ff5555')"
                        title="Rot"
                    >
                        🔴
                    </button>

                    <button
                        type="button"
                        onclick="changeTextColor('#55ff55')"
                        title="Grün"
                    >
                        🟢
                    </button>

                    <button
                        type="button"
                        onclick="changeTextColor('#5555ff')"
                        title="Blau"
                    >
                        🔵
                    </button>

                    <button
                        type="button"
                        onclick="changeTextColor('#ffff55')"
                        title="Gelb"
                    >
                        🟡
                    </button>

                    <button
                        type="button"
                        onclick="changeTextColor('#ff55ff')"
                        title="Pink"
                    >
                        🟣
                    </button>

                    <button
                        type="button"
                        onclick="changeTextColor('#55ffff')"
                        title="Cyan"
                    >
                        🔵
                    </button>

                    <div class="toolbar-separator"></div>

                    <button
                        type="button"
                        onclick="clearFormatting()"
                        title="Formatierung entfernen"
                    >
                        Tx
                    </button>

                </div>

                <div
                    id="newsMessage"
                    contenteditable="true"
                    data-placeholder="Nachricht schreiben..."
                ></div>

            </div>

            <button
                class="main-button"
                onclick="createNews()"
            >
                NEWS VERÖFFENTLICHEN
            </button>

            <div id="newsStatus"></div>

        </div>


        <div class="panel">

            <h2>VORHANDENE NEWS</h2>

            <div id="newsList">
                Lade News...
            </div>

        </div>

    </div>

</div>


<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- DOMPURIFY -->
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>


<script>

    // ==========================================
    // SUPABASE
    // ==========================================

    const SUPABASE_URL =
        "https://kinmvbfiyjpokerbbjjj.supabase.co";

    const SUPABASE_ANON_KEY =
        "sb_publishable_iZuifiHDO5_4R-PTP4Cy2w_7Eox7giU";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );


    // ==========================================
    // RICH TEXT EDITOR
    // ==========================================

    function focusEditor() {

        const editor =
            document.getElementById("newsMessage");

        editor.focus();

    }


    function formatText(command) {

        focusEditor();

        document.execCommand(
            command,
            false,
            null
        );

    }


    function changeTextColor(color) {

        focusEditor();

        document.execCommand(
            "foreColor",
            false,
            color
        );

    }


    function clearFormatting() {

        focusEditor();

        document.execCommand(
            "removeFormat",
            false,
            null
        );

    }


    // ==========================================
    // LOGIN
    // ==========================================

    async function login() {

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        const errorBox =
            document.getElementById("loginError");

        errorBox.textContent = "";

        if (!email || !password) {

            errorBox.textContent =
                "Bitte E-Mail und Passwort eingeben.";

            return;
        }

        const { data, error } =
            await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

        if (error) {

            errorBox.textContent =
                "Login fehlgeschlagen: " +
                error.message;

            return;
        }

        if (!data.session) {

            errorBox.textContent =
                "Login fehlgeschlagen: Keine Session erhalten.";

            return;
        }

        showAdmin();

    }


    // ==========================================
    // ADMIN ANZEIGEN
    // ==========================================

    function showAdmin() {

        document
            .getElementById("loginPanel")
            .classList.add("hidden");

        document
            .getElementById("adminPanel")
            .classList.remove("hidden");

        document
            .getElementById("newsDate")
            .value =
            new Date()
                .toISOString()
                .split("T")[0];

        loadNews();

    }


    // ==========================================
    // NEWS LADEN
    // ==========================================

    async function loadNews() {

        const newsList =
            document.getElementById("newsList");

        newsList.innerHTML =
            "Lade News...";

        const { data, error } =
            await supabaseClient
                .from("news")
                .select("*")
                .order("date", {
                    ascending: false
                })
                .order("created_at", {
                    ascending: false
                });

        if (error) {

            newsList.innerHTML =
                "<p class='error'>News konnten nicht geladen werden.</p>";

            console.error(error);

            return;
        }

        if (!data || data.length === 0) {

            newsList.innerHTML =
                "<p>Noch keine News vorhanden.</p>";

            return;
        }

        newsList.innerHTML = "";

        data.forEach(news => {

            const item =
                document.createElement("div");

            item.className =
                "news-item";

            const date =
                new Date(
                    news.date + "T00:00:00"
                ).toLocaleDateString(
                    "de-DE",
                    {
                        day: "2-digit",
                        month: "2-digit",
                        year: "numeric"
                    }
                );

            const safeMessage =
                DOMPurify.sanitize(
                    news.message || "",
                    {
                        ALLOWED_TAGS: [
                            "b",
                            "strong",
                            "i",
                            "em",
                            "u",
                            "s",
                            "strike",
                            "span",
                            "br"
                        ],

                        ALLOWED_ATTR: [
                            "style"
                        ],

                        ALLOWED_STYLES: [
                            "color"
                        ]
                    }
                );

            item.innerHTML = `

                <div class="news-date">
                    ${date}
                </div>

                <div class="news-message">
                    ${safeMessage}
                </div>

                <button
                    class="delete-button"
                    onclick="deleteNews(${news.id})"
                >
                    LÖSCHEN
                </button>

            `;

            newsList.appendChild(item);

        });

    }


    // ==========================================
    // NEWS ERSTELLEN
    // ==========================================

    async function createNews() {

        const editor =
            document.getElementById("newsMessage");

        const message =
            editor.innerHTML.trim();

        const plainText =
            editor.innerText.trim();

        const date =
            document
                .getElementById("newsDate")
                .value;

        const status =
            document.getElementById("newsStatus");

        status.textContent = "";
        status.className = "";


        // ------------------------------------------
        // SESSION PRÜFEN
        // ------------------------------------------

        const {
            data: sessionData,
            error: sessionError
        } =
            await supabaseClient.auth.getSession();


        if (
            sessionError ||
            !sessionData.session
        ) {

            status.textContent =
                "Du bist nicht mehr eingeloggt. Bitte erneut einloggen.";

            status.className =
                "error";

            return;

        }


        // ------------------------------------------
        // NACHRICHT PRÜFEN
        // ------------------------------------------

        if (!plainText) {

            status.textContent =
                "Bitte eine Nachricht eingeben.";

            status.className =
                "error";

            return;

        }


        if (!date) {

            status.textContent =
                "Bitte ein Datum auswählen.";

            status.className =
                "error";

            return;

        }


        // ------------------------------------------
        // HTML BEREINIGEN
        // ------------------------------------------

        const cleanMessage =
            DOMPurify.sanitize(
                message,
                {
                    ALLOWED_TAGS: [
                        "b",
                        "strong",
                        "i",
                        "em",
                        "u",
                        "s",
                        "strike",
                        "span",
                        "br"
                    ],

                    ALLOWED_ATTR: [
                        "style"
                    ],

                    ALLOWED_STYLES: [
                        "color"
                    ]
                }
            );


        // ------------------------------------------
        // NEWS SPEICHERN
        // ------------------------------------------

        const { data, error } =
            await supabaseClient
                .from("news")
                .insert([
                    {
                        message: cleanMessage,
                        date: date
                    }
                ])
                .select();


        if (error) {

            console.error(
                "Supabase INSERT Fehler:",
                error
            );

            status.textContent =
                "Fehler: " +
                error.message;

            status.className =
                "error";

            return;

        }


        // ------------------------------------------
        // ERFOLG
        // ------------------------------------------

        editor.innerHTML = "";

        status.textContent =
            "News erfolgreich veröffentlicht!";

        status.className =
            "success";

        loadNews();

    }


    // ==========================================
    // NEWS LÖSCHEN
    // ==========================================

    async function deleteNews(id) {

        const confirmDelete =
            confirm(
                "Möchtest du diese News wirklich löschen?"
            );

        if (!confirmDelete) {
            return;
        }


        const {
            data: sessionData
        } =
            await supabaseClient.auth.getSession();


        if (!sessionData.session) {

            alert(
                "Du bist nicht mehr eingeloggt."
            );

            return;

        }


        const { error } =
            await supabaseClient
                .from("news")
                .delete()
                .eq("id", id);


        if (error) {

            alert(
                "Fehler beim Löschen: " +
                error.message
            );

            console.error(error);

            return;

        }


        loadNews();

    }


    // ==========================================
    // LOGOUT
    // ==========================================

    async function logout() {

        await supabaseClient.auth.signOut();

        location.reload();

    }


    // ==========================================
    // SESSION PRÜFEN
    // ==========================================

    async function checkSession() {

        const {
            data,
            error
        } =
            await supabaseClient.auth.getSession();


        if (error) {

            console.error(
                "Session-Fehler:",
                error
            );

            return;

        }


        if (data.session) {

            showAdmin();

        }

    }


    // ==========================================
    // AUTH STATE
    // ==========================================

    supabaseClient.auth.onAuthStateChange(
        (event, session) => {

            if (event === "SIGNED_OUT") {

                document
                    .getElementById("adminPanel")
                    .classList.add("hidden");

                document
                    .getElementById("loginPanel")
                    .classList.remove("hidden");

            }

        }
    );


    // ==========================================
    // START
    // ==========================================

    checkSession();

</script>

</body>
</html>
