<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
    "https://kinmvbfiyjpokerbbjjj.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_iZuifiHDO5_4R-PTP4Cy2w_7Eox7giU";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


let authMode = "login";


/* ==========================================
   ACCOUNT MODAL
========================================== */

function openLogin() {

    authMode = "login";

    updateAuthModal();

    document
        .getElementById("accountModal")
        .classList.add("active");

}


function openRegister() {

    authMode = "register";

    updateAuthModal();

    document
        .getElementById("accountModal")
        .classList.add("active");

}


function closeAccountModal() {

    document
        .getElementById("accountModal")
        .classList.remove("active");

}


function switchAuthMode() {

    authMode =
        authMode === "login"
            ? "register"
            : "login";

    updateAuthModal();

}


function updateAuthModal() {

    const loginForm =
        document.getElementById("loginForm");

    const registerForm =
        document.getElementById("registerForm");

    const modalTitle =
        document.getElementById("modalTitle");

    const switchText =
        document.getElementById("switchText");

    const switchButton =
        document.getElementById("switchButton");


    document.getElementById("loginError").textContent = "";

    document.getElementById("registerError").textContent = "";

    document.getElementById("registerSuccess").textContent = "";


    if (authMode === "login") {

        loginForm.classList.remove("hidden");

        registerForm.classList.add("hidden");

        modalTitle.textContent =
            "EINLOGGEN";

        switchText.textContent =
            "Noch keinen Account?";

        switchButton.textContent =
            "REGISTRIEREN";

    } else {

        loginForm.classList.add("hidden");

        registerForm.classList.remove("hidden");

        modalTitle.textContent =
            "REGISTRIEREN";

        switchText.textContent =
            "Bereits einen Account?";

        switchButton.textContent =
            "EINLOGGEN";

    }

}


/* ==========================================
   USERNAME VALIDIERUNG
========================================== */

function isValidUsername(username) {

    return /^[a-zA-Z0-9_]{3,16}$/.test(username);

}


/* ==========================================
   REGISTRIEREN
========================================== */

async function register(event) {

    event.preventDefault();


    const username =
        document
            .getElementById("registerUsername")
            .value
            .trim();

    const email =
        document
            .getElementById("registerEmail")
            .value
            .trim();

    const password =
        document
            .getElementById("registerPassword")
            .value;

    const passwordConfirm =
        document
            .getElementById("registerPasswordConfirm")
            .value;


    const errorBox =
        document.getElementById("registerError");

    const successBox =
        document.getElementById("registerSuccess");


    errorBox.textContent = "";

    successBox.textContent = "";


    /* USERNAME */

    if (!isValidUsername(username)) {

        errorBox.textContent =
            "Username: 3–16 Zeichen, nur Buchstaben, Zahlen und _.";

        return;

    }


    /* PASSWORT */

    if (password.length < 8) {

        errorBox.textContent =
            "Das Passwort muss mindestens 8 Zeichen haben.";

        return;

    }


    if (password !== passwordConfirm) {

        errorBox.textContent =
            "Die Passwörter stimmen nicht überein.";

        return;

    }


    /*
       Prüfen, ob Username bereits existiert.
       Wir lesen nur den Username,
       niemals Passwort oder E-Mail.
    */

    const { data: existingProfile, error: usernameError } =
        await supabaseClient
            .from("profiles")
            .select("id")
            .eq("username", username)
            .maybeSingle();


    if (usernameError) {

        console.error(usernameError);

        errorBox.textContent =
            "Der Username konnte nicht überprüft werden.";

        return;

    }


    if (existingProfile) {

        errorBox.textContent =
            "Dieser Username ist bereits vergeben.";

        return;

    }


    /* ACCOUNT ERSTELLEN */

    const { data, error } =
        await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {

                data: {
                    username: username
                }

            }

        });


    if (error) {

        console.error(error);

        errorBox.textContent =
            "Registrierung fehlgeschlagen: " +
            error.message;

        return;

    }


    /*
       Falls E-Mail-Bestätigung aktiviert ist
    */

    if (data.user && !data.session) {

        successBox.textContent =
            "Account erstellt! Bitte bestätige deine E-Mail-Adresse.";

        document
            .getElementById("registerForm")
            .reset();

        return;

    }


    successBox.textContent =
        "Account erfolgreich erstellt!";


    document
        .getElementById("registerForm")
        .reset();


    setTimeout(() => {

        closeAccountModal();

        loadCurrentUser();

    }, 1200);

}


/* ==========================================
   LOGIN
========================================== */

async function login(event) {

    event.preventDefault();


    const email =
        document
            .getElementById("loginEmail")
            .value
            .trim();

    const password =
        document
            .getElementById("loginPassword")
            .value;


    const errorBox =
        document.getElementById("loginError");


    errorBox.textContent = "";


    const { data, error } =
        await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

        });


    if (error) {

        console.error(error);

        errorBox.textContent =
            "Login fehlgeschlagen: " +
            error.message;

        return;

    }


    document
        .getElementById("loginForm")
        .reset();


    closeAccountModal();

    loadCurrentUser();

}


/* ==========================================
   USER LADEN
========================================== */

async function loadCurrentUser() {

    const {
        data: {
            user
        }
    } =
        await supabaseClient.auth.getUser();


    const loggedOutButtons =
        document.getElementById("loggedOutButtons");

    const loggedInButtons =
        document.getElementById("loggedInButtons");

    const accountStatus =
        document.getElementById("accountStatus");

    const welcomeText =
        document.getElementById("welcomeText");


    if (!user) {

        loggedOutButtons
            .classList.remove("hidden");

        loggedInButtons
            .classList.add("hidden");

        accountStatus.textContent =
            "Nicht eingeloggt";

        return;

    }


    const {
        data: profile,
        error
    } =
        await supabaseClient
            .from("profiles")
            .select("username")
            .eq("id", user.id)
            .maybeSingle();


    if (error) {

        console.error(error);

    }


    const username =
        profile?.username ||
        "NoelSMP User";


    loggedOutButtons
        .classList.add("hidden");

    loggedInButtons
        .classList.remove("hidden");


    accountStatus.textContent =
        "Eingeloggt";


    welcomeText.innerHTML =
        `Willkommen, <span>${escapeHtml(username)}</span>!`;

}


/* ==========================================
   LOGOUT
========================================== */

async function logout() {

    const { error } =
        await supabaseClient.auth.signOut();


    if (error) {

        console.error(error);

        return;

    }


    loadCurrentUser();

}


/* ==========================================
   NEWS LADEN
========================================== */

async function loadNews() {

    const newsGrid =
        document.getElementById("newsGrid");


    const { data, error } =
        await supabaseClient
            .from("news")
            .select("*")
            .order("date", {
                ascending: false
            })
            .order("created_at", {
                ascending: false
            });


    if (error) {

        console.error(error);

        newsGrid.innerHTML = `

            <article class="news-card">

                <p>
                    NEWS KONNTEN NICHT GELADEN WERDEN.
                </p>

            </article>

        `;

        return;

    }


    newsGrid.innerHTML = "";


    data.forEach(news => {

        const article =
            document.createElement("article");


        article.className =
            "news-card";


        const date =
            new Date(
                news.date + "T00:00:00"
            )
            .toLocaleDateString(
                "de-DE",
                {
                    day: "2-digit",
                    month: "2-digit",
                    year: "numeric"
                }
            );


        /*
           Für den Moment wird die bestehende
           Textanzeige beibehalten.
           Rich-Text-Ausgabe bauen wir zusammen
           mit den Kommentaren ein.
        */

        article.innerHTML = `

            <span class="news-date">
                ${escapeHtml(date)}
            </span>

            <p>
                ${escapeHtml(news.message)}
            </p>

        `;


        newsGrid.appendChild(article);

    });

}


/* ==========================================
   HTML SICHER MACHEN
========================================== */

function escapeHtml(text) {

    const div =
        document.createElement("div");


    div.textContent =
        text ?? "";


    return div.innerHTML;

}


/* ==========================================
   SESSION ÜBERWACHEN
========================================== */

supabaseClient.auth.onAuthStateChange(
    (event, session) => {

        loadCurrentUser();

    }
);


/* ==========================================
   START
========================================== */

loadCurrentUser();

loadNews();

</script>
