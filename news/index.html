<!DOCTYPE html>

<html lang="de">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NoelSMP – Neuigkeiten</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="news.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<link rel="icon" type="image/png" href="/NoelSMPLM.png">
<link rel="stylesheet" href="/background.css">

<style>

    * {
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: "Press Start 2P", monospace;
        color: #eeeeee;
    }

    main {
        width: 100%;
        max-width: 1150px;
        margin: 0 auto;
        padding: 25px 20px 50px;
    }

    .top-nav {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: clamp(20px, 5vw, 55px);
        margin-bottom: 25px;
        padding: 18px;
        border-radius: 20px;
        background: rgba(10, 20, 40, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(12px);
    }

    .top-nav a {
        text-decoration: none;
        font-size: clamp(8px, 1.2vw, 11px);
        transition: 0.2s ease;
    }

    .top-nav a:hover {
        transform: translateY(-3px);
    }

    .nav-commands {
        color: #b28cff;
    }

    .nav-rules {
        color: #d69a6a;
    }

    .nav-ranks {
        color: #58d0c5;
    }

    .nav-logo {
        width: clamp(70px, 9vw, 105px);
        height: auto;
        transition: 0.25s ease;
    }

    .nav-logo:hover {
        transform: scale(1.05);
    }

    .news-page {
        padding: 30px;
        border-radius: 24px;
        background: rgba(10, 20, 40, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(12px);
    }

    .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 30px;
    }

    .section-label {
        display: block;
        margin-bottom: 8px;
        color: #63b5ff;
        font-size: 8px;
        letter-spacing: 1px;
    }

    .section-header h1 {
        margin: 0;
        color: #ffffff;
        font-size: 25px;
    }

    .all-news-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 10px 16px;
        border-radius: 12px;
        color: #63b5ff;
        background: rgba(99, 181, 255, 0.08);
        border: 1px solid rgba(99, 181, 255, 0.25);
        text-decoration: none;
        font-family: "Press Start 2P", monospace;
        font-size: 8px;
        transition: 0.2s ease;
    }

    .all-news-button:hover {
        color: #ffffff;
        background: rgba(99, 181, 255, 0.16);
        border-color: rgba(99, 181, 255, 0.55);
        transform: translateY(-3px);
    }

    .news-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 18px;
    }

    .news-card {
        position: relative;
        min-height: 190px;
        padding: 25px;
        padding-top: 48px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.045);
        border: 1px solid rgba(255, 255, 255, 0.08);
        overflow: hidden;
        transition: 0.25s ease;
    }

    .news-card:hover {
        transform: translateY(-6px);
        background: rgba(255, 255, 255, 0.075);
        border-color: rgba(255, 255, 255, 0.18);
        box-shadow: 0 14px 35px rgba(0, 0, 0, 0.25);
    }

    .news-card::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 3px;
        background: #63b5ff;
    }

    .news-card:nth-child(2)::before {
        background: #a978ff;
    }

    .news-card:nth-child(3)::before {
        background: #ffd35c;
    }

    .news-card:nth-child(4)::before {
        background: #55d6b0;
    }

    .news-date {
        position: absolute;
        top: 16px;
        right: 18px;
        color: rgba(255, 255, 255, 0.45);
        font-size: 7px;
        white-space: nowrap;
    }

    .news-card p {
        margin: 0;
        color: #eeeeee;
        font-size: 10px;
        line-height: 2;
    }

    footer {
        margin-top: 30px;
        padding: 25px 10px;
        text-align: center;
        color: rgba(255, 255, 255, 0.4);
        font-size: 7px;
        line-height: 2;
    }

    @media (max-width: 800px) {

        .news-grid {
            grid-template-columns: 1fr;
        }

    }

    @media (max-width: 600px) {

        main {
            padding: 12px 10px 30px;
        }

        .top-nav {
            gap: 15px;
            padding: 15px 10px;
        }

        .top-nav a {
            font-size: 7px;
        }

        .nav-logo {
            width: 65px;
        }

        .news-page {
            padding: 20px;
            border-radius: 19px;
        }

        .section-header {
            align-items: flex-start;
            flex-direction: column;
        }

        .section-header h1 {
            font-size: 19px;
        }

        .all-news-button {
            width: 100%;
        }

        .news-card {
            padding: 22px;
            padding-top: 48px;
        }

        .news-card p {
            font-size: 8px;
            line-height: 2.1;
        }

        .news-date {
            font-size: 6px;
        }

    }

    .nav-admin {
    color: #ff5c8a;
}

.nav-admin:hover {
    color: #ffffff;
}

</style>

</head>

<body>

<main>

    <nav class="top-nav">

        <a href="/commands/" class="nav-commands">
            COMMANDS
        </a>

        <a href="/rules/" class="nav-rules">
            RULES
        </a>

        <a href="/ranks/" class="nav-ranks">
            RANKS
        </a>

    

    </nav>

    <section class="news-page">

        <div class="section-header">

            <div>

                <span class="section-label">
                    NOELSMP
                </span>

                <h1>
                    NEWS
                </h1>

            </div>

            <div class="header-buttons">

    <a href="/index.html" class="all-news-button">
        ← STARTSEITE
    </a>

    <a href="/admin/" class="all-news-button">
        ＋ NEU
    </a>

</div>

        </div>

        <div class="news-grid" id="newsGrid"></div>

    </section>

    <footer>
        developed by dasnoooel
        <br>
        © 2026 NoelSMP. All Rights Reserved.
    </footer>

</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://kinmvbfiyjpokerbbjjj.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_iZuifiHDO5_4R-PTP4Cy2w_7Eox7giU";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);

async function loadNews() {

    const newsGrid = document.getElementById("newsGrid");

    const { data, error } = await supabaseClient
        .from("news")
        .select("*")
        .order("date", { ascending: false })
        .order("created_at", { ascending: false });

    if (error) {
        console.error(error);

        newsGrid.innerHTML = `
            <article class="news-card">
                <p>NEWS KONNTEN NICHT GELADEN WERDEN.</p>
            </article>
        `;

        return;
    }

    newsGrid.innerHTML = "";

    data.forEach(news => {

        const article = document.createElement("article");

        article.className = "news-card";

        const date = new Date(news.date + "T00:00:00")
            .toLocaleDateString("de-DE", {
                day: "2-digit",
                month: "2-digit",
                year: "numeric"
            });

        article.innerHTML = `
            <span class="news-date">${date}</span>
            <p>${escapeHtml(news.message)}</p>
        `;

        newsGrid.appendChild(article);
    });
}

function escapeHtml(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}

loadNews();
</script>
</body>

</html>
